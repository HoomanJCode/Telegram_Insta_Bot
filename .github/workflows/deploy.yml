name: Manual Deploy

# Manual only — never triggered on pushes or tags.
# Deploys the last published version (latest image) to the VPS.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to "latest" = last released version)'
        required: false
        default: 'latest'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    environment: production

    steps:
      - name: 🔑 Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No VPS secrets found, skipping deployment"
          fi

      - name: 🔑 Setup SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔗 Add host key
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via Docker
        if: steps.check.outputs.has_secrets == 'true'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WHITELIST_USERS: ${{ secrets.WHITELIST_USERS || '' }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS || '' }}
          STORAGE_DAYS: ${{ vars.STORAGE_DAYS || '2' }}
          MAX_TELEGRAM_SIZE_MB: ${{ vars.MAX_TELEGRAM_SIZE_MB || '50' }}
        run: |
          DEPLOY_DIR="/opt/instagram-bot"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${IMAGE_TAG}"
          CONTAINER="instagram-bot"

          cat > /tmp/deploy.sh << SCRIPTEOF
          #!/bin/bash
          set -e

          echo "========================================"
          echo "  Deploying \${IMAGE}"
          echo "========================================"

          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            echo "📦 Installing Docker..."
            curl -fsSL https://get.docker.com | sh
          fi

          # Create project directory
          mkdir -p ${DEPLOY_DIR}/{data,downloads}

          # Create .env file
          cat > ${DEPLOY_DIR}/.env << EOF
          BOT_TOKEN=${BOT_TOKEN}
          WHITELIST_USERS=${WHITELIST_USERS}
          ADMIN_USERS=${ADMIN_USERS}
          STORAGE_DAYS=${STORAGE_DAYS}
          MAX_TELEGRAM_FILE_SIZE=${MAX_TELEGRAM_SIZE_MB}
          EOF
          chmod 600 ${DEPLOY_DIR}/.env

          # Validate token
          if grep -q "^BOT_TOKEN=$" ${DEPLOY_DIR}/.env 2>/dev/null; then
            echo "❌ ERROR: BOT_TOKEN is empty!"
            exit 1
          fi

          # Create docker-compose.yml
          cat > ${DEPLOY_DIR}/docker-compose.yml << EOF
          services:
            bot:
              image: ${IMAGE}
              container_name: ${CONTAINER}
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - ./data:/app/data
                - ./downloads:/app/downloads
          EOF

          # Pull and restart
          cd ${DEPLOY_DIR}
          docker compose pull
          docker compose up -d --remove-orphans

          # Clean old images
          docker image prune -f

          # Verify
          sleep 10
          if docker inspect --format='{{.State.Status}}' ${CONTAINER} 2>/dev/null | grep -q "running"; then
            echo "✅ Container is running!"
            docker inspect --format='{{.State.Status}}' ${CONTAINER}
            docker logs --tail=10 ${CONTAINER}
          else
            echo "❌ Container failed to start!"
            docker logs --tail=30 ${CONTAINER}
            exit 1
          fi

          echo "✅ Deployment Complete!"
          SCRIPTEOF

          scp -P 22 /tmp/deploy.sh root@${VPS_HOST}:/tmp/deploy.sh
          ssh -p 22 root@${VPS_HOST} "bash /tmp/deploy.sh"