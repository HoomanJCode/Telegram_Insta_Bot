name: Release & Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────
  # 1. Run tests
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 📦 Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 🔍 Syntax check
        run: |
          echo "Checking all Python files for syntax errors..."
          FAILED=0
          for f in $(find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*"); do
            if python -m py_compile "$f"; then
              echo "✅ $f"
            else
              echo "❌ $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Syntax errors found!"
            exit 1
          fi

      - name: 🧪 Import check
        run: |
          python -c "from config import Config; print('✅ config')"
          python -c "from core.cache import FileIDCache; print('✅ cache')"
          python -c "from core.cookies import load_cookie_ids, save_cookie_ids; print('✅ cookies')"
          python -c "from core.downloader import check_gallery_dl; print('✅ downloader')"
          python -c "from handlers.start import start_cmd; print('✅ handlers')"
          python -c "from utils.helpers import check_admin, check_whitelist; print('✅ utils')"
          python -c "from utils.telegram_sender import send_message; print('✅ telegram_sender')"

  # ──────────────────────────────────────────────
  # 2. Build and push Docker image to GHCR
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    name: 🐳 Build Docker Image
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release with changelog
  # ──────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    name: 📝 Create Release
    needs: docker
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG")
            {
              echo "body<<EOF"
              echo "## What's Changed"
              echo ""
              echo "$LOG"
              echo ""
              echo "## Docker"
              echo ""
              echo "\`\`\`bash"
              echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
              echo "\`\`\`"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────
  # 4. Deploy to VPS (only if secrets exist)
  # ──────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    needs: docker
    environment: production

    steps:
      - name: 🔑 Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No VPS secrets found, skipping deployment"
          fi

      - name: 🔑 Setup SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔗 Add host key
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via Docker
        if: steps.check.outputs.has_secrets == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WHITELIST_USERS: ${{ secrets.WHITELIST_USERS || '' }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS || '' }}
          STORAGE_DAYS: ${{ vars.STORAGE_DAYS || '2' }}
          MAX_TELEGRAM_SIZE_MB: ${{ vars.MAX_TELEGRAM_SIZE_MB || '50' }}
        run: |
          DEPLOY_DIR="/opt/instagram-bot"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
          CONTAINER="instagram-bot"

          cat > /tmp/deploy.sh << SCRIPTEOF
          #!/bin/bash
          set -e

          echo "========================================"
          echo "  Deploying \${IMAGE}"
          echo "========================================"

          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            echo "📦 Installing Docker..."
            curl -fsSL https://get.docker.com | sh
          fi

          # Create project directory
          mkdir -p ${DEPLOY_DIR}/{data,downloads}

          # Create .env file
          cat > ${DEPLOY_DIR}/.env << EOF
          BOT_TOKEN=${BOT_TOKEN}
          WHITELIST_USERS=${WHITELIST_USERS}
          ADMIN_USERS=${ADMIN_USERS}
          STORAGE_DAYS=${STORAGE_DAYS}
          MAX_TELEGRAM_FILE_SIZE=${MAX_TELEGRAM_SIZE_MB}
          EOF
          chmod 600 ${DEPLOY_DIR}/.env

          # Validate token
          if grep -q "^BOT_TOKEN=$" ${DEPLOY_DIR}/.env 2>/dev/null; then
            echo "❌ ERROR: BOT_TOKEN is empty!"
            exit 1
          fi

          # Create docker-compose.yml
          cat > ${DEPLOY_DIR}/docker-compose.yml << EOF
          services:
            bot:
              image: ${IMAGE}
              container_name: ${CONTAINER}
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - ./data:/app/data
                - ./downloads:/app/downloads
          EOF

          # Pull and restart
          cd ${DEPLOY_DIR}
          docker compose pull
          docker compose up -d --remove-orphans

          # Clean old images
          docker image prune -f

          # Verify
          sleep 10
          if docker inspect --format='{{.State.Status}}' ${CONTAINER} 2>/dev/null | grep -q "running"; then
            echo "✅ Container is running!"
            docker inspect --format='{{.State.Status}}' ${CONTAINER}
            docker logs --tail=10 ${CONTAINER}
          else
            echo "❌ Container failed to start!"
            docker logs --tail=30 ${CONTAINER}
            exit 1
          fi

          echo "✅ Deployment Complete!"
          SCRIPTEOF

          scp -P 22 /tmp/deploy.sh root@${VPS_HOST}:/tmp/deploy.sh
          ssh -p 22 root@${VPS_HOST} "bash /tmp/deploy.sh"
